name: Nate News Top10 Briefing

on:
  schedule:
    # 매일 06:47 KST (= 21:47 UTC 전날) 에 어제자 랭킹 브리핑
    - cron: "47 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "랭킹 기준일 YYYYMMDD (비우면 어제)"
        required: false
      sections:
        description: "분야 코드 (pol,eco,soc,int,its,ent,spo)"
        required: false

permissions:
  contents: write

concurrency:
  group: nate-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run briefing bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NATE_SECTIONS: ${{ inputs.sections || vars.NATE_SECTIONS || 'pol,eco,soc,int,its,ent,spo' }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python -m briefing_bot.main --date "$INPUT_DATE"
          else
            python -m briefing_bot.main --yesterday
          fi

      - name: Commit briefing archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings/
          git diff --cached --quiet || git commit -m "briefing: $(ls -t briefings | head -1 | sed 's/.md//')"
          git push
