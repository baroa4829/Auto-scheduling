[project]
name = "autoscheduler"
version = "0.1.0"
description = "카카오톡·당근 채팅에서 약속을 찾아 구글 캘린더에 자동 등록"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
autoscheduler = "autoscheduler.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoscheduler*"]
